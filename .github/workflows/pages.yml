# Publica a pasta site/ no GitHub Pages a cada push nesta branch (ou à mão, em Actions → Publicar o site → Run workflow).
# Para funcionar, o Pages precisa estar ligado: Settings → Pages → Source: GitHub Actions.
name: Publicar o site

on:
  push:
    branches: [main-kr1apn]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar o site
        run: bash scripts/montar-site.sh

      # liga o Pages sozinho (modo GitHub Actions) se ainda não estiver ligado
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
